name: Hourly haze check

on:
  schedule:
    # NEA stamps readings on the hour and publishes a few minutes later.
    # Run at :05; the script retries every 30s until :15 and stops as soon as
    # the new reading is out. (Avoids :00, when GitHub's scheduler is busiest.)
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification even if air is fine"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Check haze and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Edit these in Settings > Secrets and variables > Actions > Variables
          REGIONS: ${{ vars.REGIONS || 'west,central' }}
          THRESHOLD: ${{ vars.THRESHOLD || '55' }}
          METRIC: ${{ vars.METRIC || 'pm25' }}
          FORCE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python3 haze_check.py
