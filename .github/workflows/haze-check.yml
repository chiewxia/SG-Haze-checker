name: Hourly haze check

on:
  schedule:
    # NEA stamps readings on the hour and publishes a few minutes later.
    # Run at :05; the script retries every minute until :30 and stops as soon
    # as the new reading is out. (Avoids :00, when GitHub's scheduler is busiest.)
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification even if air is fine"
        type: boolean
        default: true

# One run at a time, so two runs never overwrite each other's subscriber list.
concurrency:
  group: haze-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # Telegram subscriber list lives in the Actions cache, encrypted with the
      # bot token (a secret), so the cache is useless to anyone without it.
      # Each run restores the newest copy and saves an updated one.
      - name: Restore Telegram subscriber list
        uses: actions/cache/restore@v4
        with:
          path: .state/chats.enc
          key: telegram-chats-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-chats-
      - name: Check haze and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_STATE: .state/telegram_chats.json
          # Edit these in Settings > Secrets and variables > Actions > Variables
          REGIONS: ${{ vars.REGIONS || 'west,central' }}
          THRESHOLD: ${{ vars.THRESHOLD || '40' }}
          METRIC: ${{ vars.METRIC || 'pm25' }}
          STOP_MINUTE: ${{ vars.STOP_MINUTE || '30' }}
          POLL_SECONDS: ${{ vars.POLL_SECONDS || '60' }}
          FORCE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: |
          enc() { openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:TELEGRAM_BOT_TOKEN "$@"; }
          if [ -f .state/chats.enc ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            enc -d -in .state/chats.enc -out "$TELEGRAM_STATE" 2>/dev/null \
              || { echo "Couldn't decrypt subscriber list (token changed?); starting fresh."; rm -f "$TELEGRAM_STATE"; }
          fi
          rm -f .state/chats.enc
          status=0
          python3 haze_check.py || status=$?
          if [ -f "$TELEGRAM_STATE" ]; then
            enc -salt -in "$TELEGRAM_STATE" -out .state/chats.enc
            rm -f "$TELEGRAM_STATE"
          fi
          exit $status
      - name: Save Telegram subscriber list
        if: always() && hashFiles('.state/chats.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/chats.enc
          key: telegram-chats-${{ github.run_id }}-${{ github.run_attempt }}
